<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e1712">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Timesheets">
  <title>Berriew Bungalow</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles-v6.css">
</head>
<body>
  <div class="container">
    <header class="mast">
      <h1>Berriew Bungalow</h1>
    </header>

    <div id="sheetView">
      <div class="card">
        <label for="worker">Who's working</label>
        <select id="worker"></select>

        <label>Date</label>
        <div class="date-row" id="dateRow"></div>
      </div>

      <div id="entries"></div>
      <button class="btn-add" type="button" id="addBtn">+ Add another job</button>

      <div class="actions">
        <div class="total">Total hours <span id="total">0.00</span></div>
        <button class="btn-primary" id="submitBtn" type="button" disabled>Submit timesheet</button>
      </div>
      <div id="message"></div>
      <button type="button" class="recent-link" id="recentOpen">Recent submissions</button>
    </div>

    <div id="targetView" hidden>
      <div id="targetList"></div>
    </div>
  </div>

  <nav class="tabs">
    <button type="button" class="tab active" data-view="sheet">Timesheets</button>
    <button type="button" class="tab" data-view="target">Target</button>
  </nav>

  <div id="recentPop" class="pop">
    <button type="button" class="pop-backdrop" id="recentClose" aria-label="Close"></button>
    <div class="pop-panel" role="dialog" aria-modal="true" aria-labelledby="recentTitle">
      <div class="pop-head">
        <h2 id="recentTitle">Recent submissions</h2>
        <button type="button" class="pop-x" id="recentX" aria-label="Close">×</button>
      </div>
      <div id="recent"></div>
    </div>
  </div>

  <div id="overlay" class="overlay">
    <div class="overlay-card">
      <div id="spinner" class="spinner"></div>
      <p id="overlayText">Submitting</p>
    </div>
  </div>

  <script src="script.js?v=8"></script>
</body>
</html>
